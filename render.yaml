services:
  # FastAPI backend. The frontend is hosted on Vercel, which proxies /api/* here.
  - type: web
    name: ibps-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    # Runs from the repo root; --app-dir puts backend/ on the import path.
    startCommand: uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Comma-separated allowed origins, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
