name: Keep Render API awake

# Render's free instances sleep after ~15 minutes without traffic.
# Ping the health endpoint so the first real request isn't a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            https://ibps-api-1d5z.onrender.com/api/health
